name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Setup project
        run: |
          flutter create --org com.clevermetal --project-name clever_metal_tracker /tmp/cmbase
          cp -r /tmp/cmbase/android ./
          cp -r /tmp/cmbase/test ./
          cp /tmp/cmbase/analysis_options.yaml ./
          cp lib/main.dart lib/main.dart
          cp pubspec.yaml pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: clever-metal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
